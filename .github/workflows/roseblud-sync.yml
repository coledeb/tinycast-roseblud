name: "Roseblud · sync sermelipharo"

# main = sermelipharo/tinycast-space main + .roseblud/patches, rebuilt whenever that main moves or a
# hand-made commit lands on top. A cheap Linux check runs on every push and on the schedule, which
# GitHub runs hours late; macOS only when needed.
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if nothing changed"
        type: boolean
        default: false

concurrency:
  group: roseblud-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  BASE_REPO: https://github.com/sermelipharo/tinycast-space.git
  SUBJECT_PREFIX: "tinycast-roseblud: on space "

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.patches.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
        run: |
          BASE=$(git ls-remote "$BASE_REPO" refs/heads/main | cut -f1)
          BUILT=$(gh api "repos/$REPO/contents/.roseblud/BASE" -q .content | base64 -d | tr -d '\n' || true)
          HEAD=$(gh api "repos/$REPO/commits/main" -q .sha)
          MSG=$(gh api "repos/$REPO/commits/main" -q .commit.message | head -1)
          GO=false
          if [ "$BASE" != "$BUILT" ] || [[ "$MSG" != "$SUBJECT_PREFIX"* ]]; then GO=true; fi
          BLOCKED="Sync blocked: space ${BASE:0:7} + main ${HEAD:0:7}"
          if gh issue list --label roseblud-sync --state open --json title -q '.[].title' | grep -qxF "$BLOCKED"; then GO=false; fi
          [ "$FORCE" = "true" ] && GO=true
          echo "base=$BASE built=$BUILT main=$HEAD go=$GO"
          echo "go=$GO" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.check.outputs.go == 'true'
        with:
          fetch-depth: 0

      - id: patches
        if: steps.check.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name check; git config user.email check@localhost
          HEAD=$(git rev-parse --short=7 HEAD)
          git fetch --no-tags "$BASE_REPO" main
          BASE=$(git rev-parse FETCH_HEAD)
          if ROSEBLUD_CHECK=1 .roseblud/rebuild.sh "$BASE" check > "$RUNNER_TEMP/apply.log" 2>&1; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat "$RUNNER_TEMP/apply.log"
          echo "go=false" >> "$GITHUB_OUTPUT"
          .roseblud/report.sh open sync "Sync blocked: space ${BASE:0:7} + main $HEAD" "$RUNNER_TEMP/apply.log"
          echo "::warning::a patch no longer applies — see the roseblud-sync issue"

  sync:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Workflows write: sermelipharo's commits touch .github/workflows, which GITHUB_TOKEN can't push.
          token: ${{ secrets.ROSEBLUD_PUSH_TOKEN }}

      - name: Select Xcode 27
        run: |
          # Real folders only: an Xcode_27.N.app symlink can point at a release candidate.
          XCODE_PATH="$(find -E /Applications -maxdepth 1 -type d -regex '.*/Xcode_27(\.[0-9]+)*\.app' | sort -V | tail -n1)"
          [ -n "$XCODE_PATH" ] || { ls /Applications | grep -i xcode; exit 1; }
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Rebuild main on sermelipharo's main
        run: |
          git config user.name "coledeb"
          git config user.email "27379200+coledeb@users.noreply.github.com"
          OLD=$(git rev-parse HEAD)
          git fetch --no-tags "$BASE_REPO" main
          BASE=$(git rev-parse FETCH_HEAD)
          ROSEBLUD_REFRESH=1 .roseblud/rebuild.sh "$BASE" "$SUBJECT_PREFIX${BASE:0:7}"
          { echo "OLD=$OLD"; echo "BASE=$BASE"; } >> "$GITHUB_ENV"

      - name: Build and test
        run: .space/gate.sh "$BASE"

      # A push to main while this ran (a hand-made fix) is not a failure: the next run builds on it.
      - name: Publish main
        run: |
          git push --force-with-lease="main:$OLD" origin HEAD:main && exit 0
          [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$OLD" ] || exit 1
          echo "::notice::main moved during the build, so this result is dropped; the next run rebuilds on it"
          echo "RACED=1" >> "$GITHUB_ENV"

      - name: Close blocked issue
        if: success() && env.RACED != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .roseblud/report.sh close sync

      - name: Report blocked sync
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "${BASE:-}" ] || BASE=$(git ls-remote "$BASE_REPO" refs/heads/main | cut -f1)
          .roseblud/report.sh open sync "Sync blocked: space ${BASE:0:7} + main $(git rev-parse --short=7 origin/main)"
