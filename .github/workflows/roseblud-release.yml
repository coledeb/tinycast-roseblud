name: "Roseblud · release"

# Every sermelipharo/tinycast-space release (an upstream stable tag + .space/patches) is rebuilt with
# .roseblud/patches, signed with this fork's own identity and published here under the same tag.
on:
  schedule:
    - cron: "22,52 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "sermelipharo tag to (re)release, e.g. v0.12.1; empty = their latest"
        type: string
        required: false
      base:
        description: "sermelipharo commit or branch to build on instead of their tag, e.g. main when their release is blocked"
        type: string
        required: false

concurrency:
  group: roseblud-release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  BASE_REPO_NAME: sermelipharo/tinycast-space
  BASE_REPO: https://github.com/sermelipharo/tinycast-space.git
  SIGNING_IDENTITY: Tinycast Cole Self-Signed

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      notes: ${{ steps.check.outputs.notes }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$(gh release view -R "$BASE_REPO_NAME" --json tagName -q .tagName)}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a stable tag: $TAG"; exit 1; }
          HEAD=$(gh api "repos/$REPO/commits/main" -q .sha)
          NOTES=""
          if [ -z "$INPUT_TAG" ] && gh release view "$TAG" -R "$REPO" > /dev/null 2>&1; then
            # Released here while theirs was blocked: same tree, refresh the notes; else rebuild on it.
            if gh release view "$TAG" -R "$REPO" --json body -q .body |
                 grep -qF "<!-- roseblud:notes-from abue-ammar/tinycast -->"; then
              OURS=$(gh api "repos/$REPO/contents/.roseblud/BASE?ref=$TAG" -q .content | base64 -d)
              THEIRS=$(gh api "repos/$BASE_REPO_NAME/commits/$TAG" -q .sha)
              git init -q base
              if git -C base fetch -q --depth=1 --filter=blob:none --no-tags "$BASE_REPO" "$OURS" "$THEIRS" &&
                 git -C base diff --quiet --no-renames "$OURS" "$THEIRS" -- . ':!.space' ':!.github'; then
                NOTES="$TAG"; TAG=""
              fi
            else
              TAG=""
            fi
          fi
          if [ -n "$TAG" ] && [ -z "$INPUT_TAG" ] && gh issue list --label roseblud-release --state open \
               --json title -q '.[].title' | grep -qxF "Release blocked: $TAG + main ${HEAD:0:7}"; then TAG=""; fi
          echo "tag=$TAG notes=$NOTES"
          { echo "tag=$TAG"; echo "notes=$NOTES"; } >> "$GITHUB_OUTPUT"

  notes:
    needs: check
    if: needs.check.outputs.notes != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refresh the notes from sermelipharo's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.notes }}
        run: |
          git show "refs/tags/$TAG:.roseblud/CHANGES.md" > "$RUNNER_TEMP/changes.md"
          CHANGES="$RUNNER_TEMP/changes.md" .roseblud/notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  release:
    needs: check
    if: needs.check.outputs.tag != ''
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      TAG: ${{ needs.check.outputs.tag }}
      INPUT_BASE: ${{ inputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.ROSEBLUD_PUSH_TOKEN }}

      - name: Select Xcode 27
        run: |
          XCODE_PATH="$(find -E /Applications -maxdepth 1 -type d -regex '.*/Xcode_27(\.[0-9]+)*\.app' | sort -V | tail -n1)"
          [ -n "$XCODE_PATH" ] || { ls /Applications | grep -i xcode; exit 1; }
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Apply the patches to sermelipharo's tag
        run: |
          git config user.name "coledeb"
          git config user.email "27379200+coledeb@users.noreply.github.com"
          git fetch --no-tags "$BASE_REPO" "${INPUT_BASE:-refs/tags/$TAG}"
          BASE=$(git rev-parse "FETCH_HEAD^{commit}")
          .roseblud/rebuild.sh "$BASE" "tinycast-roseblud: ${TAG#v} (space ${BASE:0:7})"
          { echo "BASE=$BASE"; echo "VERSION=${TAG#v}"; } >> "$GITHUB_ENV"

      - name: Build and test
        run: .roseblud/gate.sh "$BASE"

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPW="$(openssl rand -base64 24)"
          echo "${P12_BASE64}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${P12_PASSWORD}" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build signed app
        run: |
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            PRODUCT_NAME="Tinycast" TINYCAST_BUNDLE_IDENTIFIER="com.tinycast.app" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/Tinycast.app"
          # sermelipharo's .space patch 0031 drops upstream's Developer ID demand for self-signed builds.
          ./Scripts/verify-signature.sh "$APP"
          codesign -dvvv "$APP" 2>&1 | grep -qx "Authority=$SIGNING_IDENTITY"

      - name: Package DMG and ZIP
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/Tinycast.app"
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist
          diskutil image create from "$STAGE" --format UDZO --volumeName "Tinycast" "dist/Tinycast-$VERSION.dmg"
          ditto -c -k --keepParent --sequesterRsrc "$APP" "dist/Tinycast-$VERSION.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # A re-release updates the existing release in place rather than deleting it first, so a failed
        # upload never leaves the tag without a release; the tag only moves from the commit seen here.
        run: |
          .roseblud/notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          TITLE="Tinycast $VERSION · Roseblud Edition"
          ASSETS=("dist/Tinycast-$VERSION.dmg" "dist/Tinycast-$VERSION.zip")
          OLD=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          git tag -f "$TAG"
          git push --force-with-lease="refs/tags/$TAG:$OLD" origin "refs/tags/$TAG"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --verify-tag --latest --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Close blocked issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: .roseblud/report.sh close release

      - name: Report blocked release
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .roseblud/report.sh open release "Release blocked: $TAG + main $(git rev-parse --short=7 origin/main)"
